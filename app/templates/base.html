<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Supermarket Visual Search{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <style>
        /* ── Design tokens ───────────────────────────────────────────────── */
        :root {
            --bg-main:        #272727;
            --bg-image:       url('{{ url_for("static", filename="darkmode_background.jpg") }}');
            --bg-overlay:     rgba(0,0,0,0.5);
            --text-main:      #ffffff;
            --text-muted:     #a0a0a0;
            --text-subtitle:  #cccccc;
            --box-bg:         #333333;
            --box-border:     #444444;
            --card-bg:        rgba(43,43,43,0.88);
            --item-bg:        #222222;
            --accent:         #61bcf7;
            --accent-hover:   #3fa8f0;
            --glass-bg:       rgba(40,40,40,0.5);
            --glass-border:   rgba(255,255,255,0.2);
            --drop-text:      #e0e0e0;
            --btn-bg:         #3498db;
            --btn-hover:      #2980b9;
            --btn-icon:       #ffffff;
            --price-color:    #2ecc71;
            --error-bg:       rgba(231,76,60,0.08);
            --error-border:   rgba(231,76,60,0.35);
            --error-text:     #e74c3c;
            --success-bg:     rgba(46,204,113,0.12);
            --success-border: rgba(46,204,113,0.35);
            --success-text:   #2ecc71;
            --input-bg:       #3a3a3a;
        }

        [data-theme="light"] {
            --bg-main:        #f4f6f9;
            --bg-image:       url('{{ url_for("static", filename="lightmode_background.jpg") }}');
            --bg-overlay:     rgba(255,255,255,0.35);
            --text-main:      #1e1e1e;
            --text-muted:     #555555;
            --text-subtitle:  #333333;
            --box-bg:         #ffffff;
            --box-border:     #dddddd;
            --card-bg:        rgba(249,249,249,0.88);
            --item-bg:        #f7f7f7;
            --accent:         #0078d7;
            --accent-hover:   #005a9e;
            --glass-bg:       rgba(255,255,255,0.45);
            --glass-border:   rgba(0,0,0,0.15);
            --drop-text:      #333333;
            --btn-bg:         #0078d7;
            --btn-hover:      #005a9e;
            --btn-icon:       #ffffff;
            --price-color:    #1a7a3c;
            --error-bg:       rgba(231,76,60,0.06);
            --error-border:   rgba(231,76,60,0.3);
            --error-text:     #c0392b;
            --success-bg:     rgba(46,204,113,0.08);
            --success-border: rgba(46,204,113,0.3);
            --success-text:   #1e8449;
            --input-bg:       #ffffff;
        }

        /* ── Base reset ──────────────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            position: relative;
            transition: background-color 0.3s, color 0.3s;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: var(--bg-image);
            background-size: cover;
            background-position: center;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background-color: var(--bg-overlay);
            z-index: -1;
            transition: background-color 0.3s;
        }

        /* ── Theme toggle ────────────────────────────────────────────────── */
        .theme-toggle {
            position: fixed;
            top: 18px;
            right: 20px;
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s, transform 0.3s;
            opacity: 0.8;
            z-index: 100;
            border-radius: 8px;
        }
        .theme-toggle:hover  { opacity: 1; transform: scale(1.1); }
        .theme-toggle:focus  { outline: 2px solid var(--accent); outline-offset: 2px; }
        .theme-toggle svg    { width: 28px; height: 28px; fill: currentColor; }

        /* ── Shared message states ───────────────────────────────────────── */
        .msg-error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 10px;
            padding: 16px 20px;
            color: var(--error-text);
            font-size: 14px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }
        .msg-success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            border-radius: 10px;
            padding: 16px 20px;
            color: var(--success-text);
            font-size: 14px;
        }
        .msg-error svg, .msg-success svg { flex-shrink: 0; margin-top: 1px; }
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>

<button class="theme-toggle" id="themeToggle" title="Toggle Light/Dark Mode" aria-label="Toggle theme">
    <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path id="themeIconPath" d=""/>
    </svg>
</button>

{% block content %}{% endblock %}

<script>
/* ── Shared theme system ───────────────────────────────────────────────────
   Convention: data-theme="light" = light mode, no attribute = dark (default).
   Both pages share the same localStorage key so switching on one persists to
   the other. ─────────────────────────────────────────────────────────────── */
const SUN_PATH  = 'M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z';
const MOON_PATH = 'M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z';

function _applyTheme(isLight) {
    if (isLight) {
        document.documentElement.setAttribute('data-theme', 'light');
    } else {
        document.documentElement.removeAttribute('data-theme');
    }
    document.getElementById('themeIconPath').setAttribute('d', isLight ? MOON_PATH : SUN_PATH);
}

// Restore saved preference immediately (before first paint)
const _savedTheme = localStorage.getItem('theme');
_applyTheme(_savedTheme === 'light');

document.getElementById('themeToggle').addEventListener('click', function () {
    const isCurrentlyLight = document.documentElement.getAttribute('data-theme') === 'light';
    const next = !isCurrentlyLight;
    localStorage.setItem('theme', next ? 'light' : 'dark');
    _applyTheme(next);
});
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
